<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<!-- ============================================================
  Firebase 設定：請貼上與 crrt_game.html 完全相同的 firebaseConfig
============================================================ -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyA6O2REvtIqMoqZzeTGmaWFobirWVqUXmY",
    authDomain: "crrt-training.firebaseapp.com",
    projectId: "crrt-training",
    storageBucket: "crrt-training.firebasestorage.app",
    messagingSenderId: "249702646352",
    appId: "1:249702646352:web:8025502203f5d9e5b5c755"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排行榜｜CRRT 模擬訓練系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#071b34; --navy-mid:#0e2c50; --navy-panel:#123563;
    --blue-primary:#1c5aa8; --cyan-accent:#20c9d6; --cyan-soft:#8fe6ec;
    --white:#f5f9fc; --ink:#0a2647; --muted:#6f89a8;
    --alarm:#e5484d; --ok:#39c98f; --warn:#e8b23d; --gold:#f0c419; --silver:#c7d0d8; --bronze:#cd7f32;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{min-height:100%;}
  body{
    font-family:'Noto Sans TC', sans-serif;
    background:linear-gradient(180deg, var(--navy-deep) 0%, var(--navy-mid) 55%, #081d38 100%);
    min-height:100vh; color:var(--white); padding-bottom:30px;
  }
  header{
    position:sticky; top:0; z-index:20; background:rgba(7,27,52,0.92); backdrop-filter:blur(6px);
    border-bottom:1px solid rgba(143,230,236,0.15); padding:14px 18px; display:flex; align-items:center; gap:14px;
  }
  .back-btn{
    width:36px; height:36px; border-radius:10px; border:1px solid rgba(143,230,236,0.3);
    background:rgba(255,255,255,0.04); color:var(--cyan-soft); font-size:17px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .header-text .title{ font-family:'Rajdhani', sans-serif; font-weight:700; font-size:19px; letter-spacing:1px; }
  .header-text .sub{ font-size:11.5px; color:var(--cyan-soft); letter-spacing:1px; margin-top:2px;}
  .refresh-btn{
    margin-left:auto; font-family:inherit; font-size:12px; font-weight:700; color:var(--cyan-soft);
    background:rgba(255,255,255,0.06); border:1px solid rgba(143,230,236,0.25); border-radius:20px;
    padding:8px 14px; cursor:pointer; flex-shrink:0;
  }
  main{ max-width:680px; margin:0 auto; padding:20px 16px 0; }

  .loading{ text-align:center; padding:60px 20px; color:var(--muted); font-size:13px; }
  .loading .spin{ font-size:28px; margin-bottom:10px; animation:spin 1.2s linear infinite; display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .empty-state{ text-align:center; padding:50px 20px; color:var(--muted); font-size:13px; line-height:1.8; }
  .empty-state .big{ font-size:34px; margin-bottom:10px; }

  .error-state{
    background:rgba(229,72,77,0.1); border:1px solid rgba(229,72,77,0.35); border-radius:12px;
    padding:14px; font-size:12.5px; color:#f5b9bc; text-align:center; margin-top:20px;
  }

  .rank-row{
    display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:14px;
    background:rgba(255,255,255,0.045); border:1px solid rgba(143,230,236,0.15); margin-bottom:10px; cursor:pointer;
  }
  .rank-row:hover{ border-color:rgba(32,201,214,0.4); }
  .rank-row.top1{ border-color:rgba(240,196,25,0.5); background:linear-gradient(90deg, rgba(240,196,25,0.1), rgba(255,255,255,0.045)); }
  .rank-row.top2{ border-color:rgba(199,208,216,0.4); }
  .rank-row.top3{ border-color:rgba(205,127,50,0.4); }

  .rank-num{
    width:34px; height:34px; border-radius:50%; background:var(--navy-panel); color:var(--cyan-soft);
    display:flex; align-items:center; justify-content:center; font-weight:900; font-size:14px; flex-shrink:0;
    font-family:'Share Tech Mono',monospace;
  }
  .rank-row.top1 .rank-num{ background:var(--gold); color:#3a2c00; }
  .rank-row.top2 .rank-num{ background:var(--silver); color:#1c2733; }
  .rank-row.top3 .rank-num{ background:var(--bronze); color:#2e1a05; }

  .rank-info{ flex:1; min-width:0; }
  .rank-info .rn-name{ font-size:14.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rank-info .rn-meta{ font-size:10.5px; color:var(--muted); margin-top:2px; }
  .rank-score{ font-size:19px; font-weight:900; color:var(--cyan-accent); font-family:'Share Tech Mono',monospace; flex-shrink:0; }
  .rank-chevron{ color:var(--muted); font-size:14px; flex-shrink:0; transition:transform .2s; }
  .rank-row.expanded .rank-chevron{ transform:rotate(90deg); }
  .delete-btn{
    flex-shrink:0; width:30px; height:30px; border-radius:8px; border:1px solid rgba(229,72,77,0.3);
    background:rgba(229,72,77,0.08); color:var(--alarm); font-size:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .delete-btn:hover{ background:rgba(229,72,77,0.2); }

  .auth-btn{
    margin-left:auto; font-family:inherit; font-size:11.5px; font-weight:700; color:var(--cyan-soft);
    background:rgba(255,255,255,0.06); border:1px solid rgba(143,230,236,0.25); border-radius:20px;
    padding:8px 12px; cursor:pointer; flex-shrink:0; white-space:nowrap;
  }
  .auth-btn.logged-in{ color:var(--ok); border-color:rgba(57,201,143,0.4); background:rgba(57,201,143,0.1); }

  .login-panel{
    position:fixed; inset:0; z-index:50; background:rgba(4,12,24,0.75);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login-box{
    background:var(--navy-mid); border:1px solid rgba(143,230,236,0.25); border-radius:16px;
    padding:22px; width:100%; max-width:340px;
  }
  .login-title{ font-size:15px; font-weight:900; margin-bottom:14px; text-align:center; }
  .login-box input{
    width:100%; padding:11px 14px; border-radius:10px; border:1px solid rgba(143,230,236,0.2);
    background:rgba(255,255,255,0.05); color:#fff; font-size:13px; font-family:inherit; margin-bottom:10px;
  }
  .login-error{ font-size:11.5px; color:var(--alarm); min-height:16px; margin-bottom:8px; text-align:center; }
  .login-actions{ display:flex; gap:8px; }
  .login-actions button{
    flex:1; font-family:inherit; font-weight:700; font-size:13px; padding:11px; border-radius:10px; border:none; cursor:pointer;
  }
  #loginSubmitBtn{ background:var(--cyan-accent); color:var(--navy-deep); }
  #loginCancelBtn{ background:rgba(255,255,255,0.08); color:#fff; border:1px solid rgba(143,230,236,0.25); }

  .rank-detail{ display:none; padding:0 16px 14px 62px; margin-top:-10px; }
  .rank-detail.show{ display:block; }
  .round-item{
    background:rgba(255,255,255,0.04); border:1px solid rgba(143,230,236,0.12); border-radius:10px;
    padding:11px 13px; margin-bottom:8px; font-size:12px;
  }
  .round-item .rh{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .round-item .rt{ font-weight:700; font-size:12.5px; }
  .round-item .rs{ font-weight:900; color:var(--cyan-soft); font-family:'Share Tech Mono',monospace; }
  .round-item .r-status{ font-size:10px; color:var(--muted); margin-bottom:6px; }
  .round-item .r-status.timeout{ color:var(--alarm); }
  .round-item .r-mistakes-h{ font-size:10px; color:var(--alarm); font-weight:700; margin-bottom:3px; }
  .round-item .r-mistake{ font-size:10.5px; color:var(--muted); line-height:1.6; padding-left:8px; border-left:2px solid rgba(229,72,77,0.35); margin-bottom:3px; }
  .round-item .no-mistakes{ font-size:10.5px; color:var(--ok); }

  .filter-bar{ display:flex; gap:8px; margin-bottom:16px; }
  .filter-bar input{
    flex:1; padding:11px 14px; border-radius:10px; border:1px solid rgba(143,230,236,0.2);
    background:rgba(255,255,255,0.05); color:#fff; font-size:13px; font-family:inherit;
  }
  .filter-bar input::placeholder{ color:var(--muted); }

  .count-note{ font-size:11px; color:var(--muted); text-align:center; margin:16px 0 4px; }
</style>
</head>
<body>

<header>
  <button class="back-btn" id="backBtn">←</button>
  <div class="header-text">
    <div class="title">排行榜</div>
    <div class="sub">正式挑戰成績・依總分排序</div>
  </div>
  <button class="auth-btn" id="authBtn">🔑 老師登入</button>
  <button class="refresh-btn" id="refreshBtn">↻ 重新整理</button>
</header>

<div class="login-panel" id="loginPanel" style="display:none;">
  <div class="login-box">
    <div class="login-title">老師登入</div>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="密碼">
    <div class="login-error" id="loginError"></div>
    <div class="login-actions">
      <button id="loginSubmitBtn">登入</button>
      <button id="loginCancelBtn">取消</button>
    </div>
  </div>
</div>

<main>
  <div class="filter-bar" id="filterBar" style="display:none;">
    <input type="text" id="filterInput" placeholder="搜尋學員姓名…">
  </div>

  <div id="content">
    <div class="loading"><div class="spin">⏳</div>讀取排行榜資料中…</div>
  </div>
</main>

<script>
  const backBtn = document.getElementById('backBtn');
  const refreshBtn = document.getElementById('refreshBtn');
  const content = document.getElementById('content');
  const filterBar = document.getElementById('filterBar');
  const filterInput = document.getElementById('filterInput');

  let allEntries = [];
  let isTeacherLoggedIn = false;

  const authBtn = document.getElementById('authBtn');
  const loginPanel = document.getElementById('loginPanel');
  const loginEmail = document.getElementById('loginEmail');
  const loginPassword = document.getElementById('loginPassword');
  const loginError = document.getElementById('loginError');

  authBtn.addEventListener('click', () => {
    if(isTeacherLoggedIn){
      auth.signOut();
    } else {
      loginError.textContent = '';
      loginEmail.value = '';
      loginPassword.value = '';
      loginPanel.style.display = 'flex';
      loginEmail.focus();
    }
  });
  document.getElementById('loginCancelBtn').addEventListener('click', () => {
    loginPanel.style.display = 'none';
  });
  document.getElementById('loginSubmitBtn').addEventListener('click', doLogin);
  loginPassword.addEventListener('keydown', (e) => { if(e.key === 'Enter') doLogin(); });

  async function doLogin(){
    loginError.textContent = '';
    const email = loginEmail.value.trim();
    const password = loginPassword.value;
    if(!email || !password){
      loginError.textContent = '請輸入 Email 與密碼。';
      return;
    }
    try {
      await auth.signInWithEmailAndPassword(email, password);
      loginPanel.style.display = 'none';
    } catch(e){
      loginError.textContent = '登入失敗，請確認帳號密碼是否正確。';
    }
  }

  auth.onAuthStateChanged((user) => {
    isTeacherLoggedIn = !!user;
    authBtn.textContent = isTeacherLoggedIn ? `👤 ${user.email}（登出）` : '🔑 老師登入';
    authBtn.classList.toggle('logged-in', isTeacherLoggedIn);
    renderList(filterInput.value.trim());
  });

  backBtn.addEventListener('click', () => {
    const params = new URLSearchParams(location.search);
    const name = params.get('name');
    location.href = 'index.html' + (name ? ('?name=' + encodeURIComponent(name)) : '');
  });
  refreshBtn.addEventListener('click', loadLeaderboard);
  filterInput.addEventListener('input', () => renderList(filterInput.value.trim()));

  function fmtTime(ts){
    try {
      const d = new Date(ts);
      const pad = n => String(n).padStart(2,'0');
      return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    } catch(e){ return ''; }
  }

  async function loadLeaderboard(){
    content.innerHTML = `<div class="loading"><div class="spin">⏳</div>讀取排行榜資料中…</div>`;
    filterBar.style.display = 'none';
    try {
      const snapshot = await db.collection('leaderboard').orderBy('totalScore', 'desc').get();
      const entries = [];
      snapshot.forEach(doc => entries.push({ ...doc.data(), _id: doc.id }));
      allEntries = entries;
      filterBar.style.display = entries.length > 5 ? 'flex' : 'none';
      renderList('');
    } catch(e){
      content.innerHTML = `<div class="error-state">⚠ 讀取排行榜失敗，請點右上角「重新整理」再試一次。（${e && e.message ? e.message : '未知錯誤'}）</div>`;
    }
  }

  function renderList(filterText){
    const filtered = filterText
      ? allEntries.filter(e => (e.name||'').toLowerCase().includes(filterText.toLowerCase()))
      : allEntries;

    if(allEntries.length === 0){
      content.innerHTML = `<div class="empty-state"><div class="big">🏁</div>目前還沒有人提交成績。<br>完成一次「正式挑戰」後即可上榜！</div>`;
      return;
    }
    if(filtered.length === 0){
      content.innerHTML = `<div class="empty-state"><div class="big">🔍</div>找不到符合的學員姓名。</div>`;
      return;
    }

    content.innerHTML = '';
    filtered.forEach((entry, idx) => {
      const rank = allEntries.indexOf(entry) + 1;
      const row = document.createElement('div');
      row.className = 'rank-row' + (rank === 1 ? ' top1' : rank === 2 ? ' top2' : rank === 3 ? ' top3' : '');
      const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
      row.innerHTML = `
        <div class="rank-num">${medal}</div>
        <div class="rank-info">
          <div class="rn-name">${escapeHtml(entry.name || '未具名學員')}</div>
          <div class="rn-meta">${fmtTime(entry.timestamp)} ・ 共 ${(entry.rounds||[]).length} 關</div>
        </div>
        <div class="rank-score">${entry.totalScore ?? 0}</div>
        ${isTeacherLoggedIn ? '<button class="delete-btn" title="刪除這筆紀錄">🗑</button>' : ''}
        <div class="rank-chevron">▶</div>`;
      const detail = document.createElement('div');
      detail.className = 'rank-detail';
      detail.innerHTML = buildDetailHtml(entry);
      row.addEventListener('click', () => {
        const showing = detail.classList.toggle('show');
        row.classList.toggle('expanded', showing);
      });
      const delBtn = row.querySelector('.delete-btn');
      if(delBtn){
        delBtn.addEventListener('click', async (ev) => {
          ev.stopPropagation();
          if(!confirm(`確定要刪除「${entry.name || '未具名學員'}」這筆成績嗎？此動作無法復原。`)) return;
          try {
            await db.collection('leaderboard').doc(entry._id).delete();
            loadLeaderboard();
          } catch(e){
            alert('刪除失敗：' + (e && e.message ? e.message : '未知錯誤'));
          }
        });
      }
      content.appendChild(row);
      content.appendChild(detail);
    });
  }

  function buildDetailHtml(entry){
    const rounds = entry.rounds || [];
    if(rounds.length === 0) return `<div class="round-item">無詳細紀錄</div>`;
    return rounds.map((r, i) => {
      const mistakes = r.mistakes || [];
      const mistakesHtml = mistakes.length
        ? `<div class="r-mistakes-h">⚠ 誤選紀錄（共 ${mistakes.length} 次）</div>` +
          mistakes.map(m => `<div class="r-mistake">${escapeHtml(m.label)}（${m.penalty}分）</div>`).join('')
        : `<div class="no-mistakes">✅ 全程無誤選</div>`;
      return `
        <div class="round-item">
          <div class="rh"><span class="rt">第 ${i+1} 關．${escapeHtml(r.title||'')}</span><span class="rs">${r.roundScore ?? 0} 分</span></div>
          <div class="r-status ${r.completed ? '' : 'timeout'}">${r.completed ? '✅ 已完成' : '⏱ 時間到，未完成'}</div>
          ${mistakesHtml}
        </div>`;
    }).join('');
  }

  function escapeHtml(s){
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  loadLeaderboard();
</script>

</body>
</html>
