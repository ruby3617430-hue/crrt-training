<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>遊戲情境｜CRRT 模擬訓練系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#071b34; --navy-mid:#0e2c50; --navy-panel:#123563;
    --blue-primary:#1c5aa8; --cyan-accent:#20c9d6; --cyan-soft:#8fe6ec;
    --white:#f5f9fc; --ink:#0a2647; --muted:#6f89a8;
    --alarm:#e5484d; --alarm-glow:rgba(229,72,77,0.5); --ok:#39c98f; --warn:#e8b23d;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Noto Sans TC', sans-serif;
    background:linear-gradient(180deg, var(--navy-deep) 0%, var(--navy-mid) 55%, #081d38 100%);
    min-height:100vh; color:var(--white); padding-bottom:24px;
  }
  header{
    position:sticky; top:0; z-index:20; background:rgba(7,27,52,0.92); backdrop-filter:blur(6px);
    border-bottom:1px solid rgba(143,230,236,0.15); padding:14px 18px; display:flex; align-items:center; gap:14px;
  }
  .back-btn{
    width:36px; height:36px; border-radius:10px; border:1px solid rgba(143,230,236,0.3);
    background:rgba(255,255,255,0.04); color:var(--cyan-soft); font-size:17px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .header-text .title{ font-family:'Rajdhani', sans-serif; font-weight:700; font-size:19px; letter-spacing:1px; }
  .header-text .sub{ font-size:11.5px; color:var(--cyan-soft); letter-spacing:1px; margin-top:2px;}
  main{ max-width:680px; margin:0 auto; padding:20px 16px 0; }

  .notice{
    background:rgba(232,178,61,0.1); border:1px solid rgba(232,178,61,0.35); border-radius:12px;
    padding:12px 14px; font-size:12px; line-height:1.8; color:#f2d99a; margin-bottom:18px;
  }
  .notice b{ color:var(--warn); }
  .scenario-grid{ display:flex; flex-direction:column; gap:10px; margin-bottom:10px; }
  .scenario-card{
    display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:12px;
    background:rgba(255,255,255,0.045); border:1px solid rgba(143,230,236,0.15); cursor:pointer;
  }
  .scenario-card.locked{ opacity:0.45; cursor:not-allowed; }
  .scenario-card:not(.locked):hover{ border-color:rgba(32,201,214,0.5); }
  .sc-num{
    width:30px; height:30px; border-radius:8px; background:var(--navy-panel); color:var(--cyan-soft);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;
  }
  .sc-info .sc-title{ font-size:14px; font-weight:700; }
  .sc-info .sc-tag{ font-size:11px; color:var(--muted); margin-top:2px; }
  .sc-status{ margin-left:auto; font-size:11px; color:var(--cyan-soft); flex-shrink:0; }
  .scenario-card.locked .sc-status{ color:var(--muted); }

  #playScreen{ display:none; }

  .machine-shell{
    background:linear-gradient(180deg,#8a9a97,#5c716d); border-radius:22px; padding:14px;
    box-shadow:0 22px 55px rgba(2,12,28,0.55); margin-bottom:16px; position:relative;
  }
  .machine-brand{ text-align:center; color:#e8f0ee; font-size:13px; letter-spacing:2px; padding:2px 0 10px; opacity:0.8; font-family:'Rajdhani',sans-serif;}
  .machine-screen{
    background:
      linear-gradient(rgba(210,226,235,0.5) 1px, transparent 1px) 0 0/100% 22px,
      linear-gradient(90deg, rgba(210,226,235,0.5) 1px, transparent 1px) 0 0/22px 100%,
      #dfe9ef;
    border-radius:10px; overflow:hidden; border:3px solid #2c3e3c;
  }
  .m-topbar{ display:flex; justify-content:flex-end; gap:10px; padding:6px 12px 0; font-size:11px; color:#2a4a63; font-family:'Share Tech Mono',monospace; }
  .m-modebar{ display:flex; justify-content:space-between; padding:0 12px 4px; font-size:11px; color:#2a4a63; }
  .m-banner{
    background:linear-gradient(120deg, #e14b4b 0%, #d43c3c 70%, #c22f2f 100%);
    clip-path: polygon(0 0, 100% 0, 96% 100%, 0% 100%);
    color:#fff; font-weight:700; font-size:15px; text-align:center; padding:10px 40px 10px 20px; margin:0 8px;
    letter-spacing:1px; position:relative;
  }
  .m-banner.silenced{ background:linear-gradient(120deg,#b98a8a,#a97878); }
  .m-banner.notice{ background:linear-gradient(120deg,#f5d80e 0%,#f0cf00 70%,#e0c000 100%); color:#1c1c00; }
  .m-banner.notice.silenced{ background:linear-gradient(120deg,#d8cfa0,#cbc292); color:#4a4a30; }
  .m-banner.pulsing{ animation:m-flash 0.9s ease-in-out infinite; }
  .octagon-panel{ display:flex; flex-direction:column; align-items:center; }
  .octagon-badge{
    width:56px; height:56px;
    clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
    filter: drop-shadow(1.5px 0 0 rgba(0,0,0,0.55)) drop-shadow(-1.5px 0 0 rgba(0,0,0,0.55)) drop-shadow(0 1.5px 0 rgba(0,0,0,0.55)) drop-shadow(0 -1.5px 0 rgba(0,0,0,0.55));
  }
  .octagon-badge.shape-triangle{ clip-path: polygon(50% 4%, 98% 96%, 2% 96%); }
  .octagon-badge.shape-square{ clip-path: none; }
  .octagon-badge.shape-circle{ clip-path: circle(50% at 50% 50%); }
  .octagon-badge.shape-octagon{ clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%); }
  .octagon-label{ display:none; }
  .m-body.octagon-mode{ position:relative; }
  .m-body.octagon-mode .m-left{ flex:1 1 100%; padding-right:76px; }
  .m-body.octagon-mode .octagon-panel{ position:absolute; top:0; right:14px; }
  .m-body.octagon-mode .m-right{ display:none; }
  @keyframes m-flash{ 0%,100%{ filter:brightness(1);} 50%{ filter:brightness(1.25);} }

  .m-body{ display:flex; gap:14px; padding:12px 14px 16px; }
  .m-left{ flex:1.15; font-size:12px; color:#1c3a52; line-height:1.75; }
  .m-left .selfclear{ color:#c0392b; font-weight:700; margin-bottom:4px; }
  .m-left .pre-line{ font-weight:700; margin-bottom:6px; }
  .m-left .action-h{ font-weight:700; margin-bottom:4px; }
  .m-left ol{ padding-left:16px; margin-bottom:10px; }
  .m-left .other-causes-h{ font-weight:700; margin-bottom:4px; }
  .m-left .other-causes{ margin-bottom:10px; }
  .m-left .helpline{ color:#1c3a52; }
  .m-left .warning-note{ color:#d9480f; font-weight:700; margin-bottom:10px; line-height:1.7; }
  .m-left .kw{ font-weight:700; }

  .m-right{ flex:1; }
  .m-right .p-title{ font-size:12px; font-weight:700; color:#1c3a52; text-align:center; margin-bottom:8px; }
  .gauge-row{ display:flex; align-items:flex-start; gap:10px; margin-bottom:13px; }
  .gauge-row .g-left{ width:56px; flex-shrink:0; }
  .gauge-row .g-name{ font-size:11px; color:#1c3a52; font-weight:700; margin-bottom:1px; }
  .gauge-row .g-value{ font-size:19px; font-weight:900; color:#d81e26; font-family:'Share Tech Mono',monospace; line-height:1; }
  .gauge-row .g-bar-wrap{ flex:1; padding-top:4px; }
  .gauge-row .g-track{ position:relative; height:13px; border-radius:3px; overflow:hidden; background:#c7d3da; }
  .gauge-row .g-track .g-zone{ position:absolute; top:0; bottom:0; background:#e5484d; }
  .gauge-row .g-track .g-endcap{ position:absolute; top:0; bottom:0; background:#e5484d; width:4%; }
  .gauge-row .g-track .g-marker2{
    position:absolute; bottom:-1px; width:0; height:0; transform:translateX(-50%);
    border-left:4px solid transparent; border-right:4px solid transparent; border-bottom:6px solid #24466b;
  }
  .gauge-row .g-track .g-marker{
    position:absolute; top:-3px; width:0; height:0; transform:translateX(-50%);
    border-left:5px solid transparent; border-right:5px solid transparent; border-top:8px solid #24466b;
  }
  .gauge-row .g-range{ position:relative; height:13px; margin-top:2px; }
  .gauge-row .g-range span{ position:absolute; top:0; font-size:9.5px; font-weight:700; color:#1c3a52; white-space:nowrap; }
  .m-metrics{ display:flex; justify-content:space-between; font-size:11px; color:#1c3a52; margin-top:6px; padding-top:6px; border-top:1px solid #b9c8d0;}

  .m-buttons{ display:flex; align-items:center; gap:6px; padding:0 14px 16px; position:relative; flex-wrap:wrap; }
  .m-btn{
    font-family:inherit; font-size:11px; font-weight:700; color:#1c3a52; background:linear-gradient(180deg,#eef6fa,#cfe1ea);
    border:1px solid #9fb7c4; border-radius:8px; padding:10px 5px; text-align:center; cursor:pointer; flex:1;
  }
  .m-btn:disabled{ opacity:0.55; cursor:not-allowed; }
  .m-btn.mute{ flex:0 0 46px; font-size:17px; padding:8px 0; }
  .m-btn.spacer{ flex:0.6; background:transparent; border:none; cursor:default; }
  .m-btn.resume{ background:linear-gradient(180deg,#bdf0d8,#7fd6ac); border-color:#4fae7f; }
  .m-btn.release{ background:linear-gradient(180deg,#fde3b0,#f0c877); border-color:#c99a3a; }
  .m-btn.checkalarm{
    position:absolute; right:14px; top:-46px; flex:none; width:60px; font-size:10px; padding:8px 4px;
  }

  .training-panel{
    background:rgba(255,255,255,0.045); border:1px solid rgba(143,230,236,0.18); border-radius:14px; padding:16px;
  }
  .score-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .tp-step-label{ font-size:11px; color:var(--cyan-soft); letter-spacing:1px; font-weight:700; }
  .score-badge{ font-size:12px; font-weight:700; color:var(--cyan-soft); background:rgba(255,255,255,0.06);
    padding:4px 10px; border-radius:20px; border:1px solid rgba(143,230,236,0.25); white-space:nowrap; transition:color .2s; }
  .score-badge.down{ color:var(--alarm); border-color:rgba(229,72,77,0.5); }
  .score-badge.up{ color:var(--ok); border-color:rgba(57,201,143,0.5); }
  .cue-card{
    background:rgba(255,255,255,0.05); border-left:3px solid var(--cyan-accent); border-radius:8px;
    padding:12px 14px; font-size:12.5px; line-height:1.7; color:#dbeaf4; margin-bottom:12px;
  }
  .cue-card b{ color:var(--cyan-soft); }
  .btn-device{
    width:100%; font-family:inherit; font-size:13.5px; font-weight:700; letter-spacing:0.3px;
    padding:12px 14px; border-radius:10px; border:1px solid rgba(143,230,236,0.2); cursor:pointer; margin-bottom:8px;
    background:rgba(255,255,255,0.07); color:#fff; text-align:left; transition:transform .1s, background .15s;
  }
  .btn-device:active{ transform:scale(0.99); }
  .btn-device:disabled{ opacity:0.35; cursor:not-allowed; }
  .btn-device.wrong-flash{ background:rgba(229,72,77,0.35); border-color:var(--alarm); }
  .btn-device.correct-flash{ background:rgba(57,201,143,0.35); border-color:var(--ok); }

  .success-card{ display:none; text-align:center; padding:6px 4px 4px; }
  .success-card .big-icon{ font-size:40px; margin-bottom:8px; }
  .success-card h3{ font-size:17px; margin-bottom:8px; color:var(--ok); }
  .success-card p{ font-size:12.5px; color:var(--muted); line-height:1.8; margin-bottom:14px; }
  .success-actions{ display:flex; gap:10px; }
  .success-actions button{
    flex:1; font-family:inherit; font-weight:700; font-size:13px; padding:12px; border-radius:10px; border:none; cursor:pointer;
  }
  .success-actions .again{ background:var(--cyan-accent); color:var(--navy-deep); }
  .success-actions .back{ background:rgba(255,255,255,0.08); color:#fff; border:1px solid rgba(143,230,236,0.25); }

  .sound-hint{ font-size:10.5px; color:var(--muted); text-align:center; margin:8px 0 16px; }

  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--navy-panel); color:#fff; padding:12px 20px; border-radius:10px; font-size:13px;
    opacity:0; pointer-events:none; transition:all .25s ease; border:1px solid rgba(32,201,214,0.35);
    z-index:25; max-width:90vw; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.bad{ border-color:var(--alarm); }
  .toast.good{ border-color:var(--ok); }

  /* ---- 正式挑戰入口卡 ---- */
  .challenge-card{
    background:linear-gradient(135deg, rgba(28,90,168,0.35), rgba(32,201,214,0.18));
    border:1px solid rgba(32,201,214,0.4); border-radius:16px; padding:18px; margin-bottom:18px; text-align:center;
  }
  .challenge-title{ font-size:16px; font-weight:900; margin-bottom:6px; }
  .challenge-desc{ font-size:12px; color:var(--cyan-soft); line-height:1.7; margin-bottom:14px; }
  .challenge-btn{
    width:100%; font-family:inherit; font-size:14.5px; font-weight:900; letter-spacing:0.5px;
    padding:14px; border-radius:12px; border:none; cursor:pointer; margin-bottom:8px;
    background:linear-gradient(135deg, var(--cyan-accent), #1c9ba5); color:var(--navy-deep);
    box-shadow:0 10px 24px rgba(32,201,214,0.4);
  }
  .leaderboard-link{
    width:100%; font-family:inherit; font-size:12.5px; font-weight:700; padding:9px; border-radius:10px;
    border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.06); color:#fff; cursor:pointer;
  }

  /* ---- 計時器 / 關卡徽章 ---- */
  .timer-badge{
    font-size:12px; font-weight:900; color:var(--cyan-soft); background:rgba(255,255,255,0.06);
    padding:4px 10px; border-radius:20px; border:1px solid rgba(143,230,236,0.25); white-space:nowrap;
    font-family:'Share Tech Mono', monospace;
  }
  .timer-badge.urgent{ color:#fff; background:var(--alarm); border-color:var(--alarm); animation:m-flash 0.6s ease-in-out infinite; }
  .round-badge{ font-size:11px; color:var(--muted); text-align:center; margin-bottom:8px; letter-spacing:1px; }

  /* ---- 挑戰結果畫面 ---- */
  #resultsScreen{ max-width:100%; }
  .results-summary{ text-align:center; padding:22px 14px; background:linear-gradient(180deg, rgba(32,201,214,0.14), transparent); border-radius:16px; margin-bottom:18px; }
  .results-icon{ font-size:38px; margin-bottom:6px; }
  .results-total-label{ font-size:12px; color:var(--cyan-soft); letter-spacing:2px; margin-bottom:4px; }
  .results-total{ font-size:44px; font-weight:900; font-family:'Share Tech Mono',monospace; color:#fff; }
  .results-name{ font-size:12px; color:var(--muted); margin-top:4px; }

  .round-item{
    background:rgba(255,255,255,0.045); border:1px solid rgba(143,230,236,0.15); border-radius:12px;
    padding:14px 16px; margin-bottom:10px;
  }
  .round-item .rh{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .round-item .rh .rt{ font-size:13.5px; font-weight:700; }
  .round-item .rh .rs{ font-size:13px; font-weight:900; color:var(--cyan-soft); font-family:'Share Tech Mono',monospace; }
  .round-item .r-status{ font-size:10.5px; color:var(--muted); margin-bottom:8px; }
  .round-item .r-status.timeout{ color:var(--alarm); }
  .round-item .r-answer{ font-size:12px; color:#dbeaf4; line-height:1.7; background:rgba(57,201,143,0.08); border-left:3px solid var(--ok); padding:8px 10px; border-radius:6px; margin-bottom:8px; }
  .round-item .r-mistakes-h{ font-size:11px; color:var(--alarm); font-weight:700; margin-bottom:4px; }
  .round-item .r-mistake{ font-size:11.5px; color:var(--muted); line-height:1.6; padding-left:10px; border-left:2px solid rgba(229,72,77,0.4); margin-bottom:4px; }

  .results-actions{ margin-top:8px; }
  .submit-btn{
    width:100%; font-family:inherit; font-size:14px; font-weight:900; padding:14px; border-radius:12px; border:none;
    cursor:pointer; background:linear-gradient(135deg, var(--ok), #1f8a5f); color:#04180f; margin-bottom:8px;
  }
  .submit-btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .submit-status{ font-size:11.5px; color:var(--muted); text-align:center; min-height:16px; margin-bottom:10px; }
  .results-nav{ display:flex; gap:8px; flex-wrap:wrap; }
  .nav-secondary{
    flex:1; min-width:100px; font-family:inherit; font-size:12px; font-weight:700; padding:10px; border-radius:10px;
    border:1px solid rgba(143,230,236,0.25); background:rgba(255,255,255,0.06); color:#fff; cursor:pointer;
  }

  @media (max-width:480px){
    .m-body{ flex-direction:column; }
    .m-btn.checkalarm{ position:static; width:auto; margin-bottom:8px; }
  }

  .view-toggle{
    position:fixed; top:12px; right:12px; z-index:60; display:flex; gap:2px;
    background:rgba(7,27,52,0.88); border:1px solid rgba(143,230,236,0.25); border-radius:20px;
    padding:3px; backdrop-filter:blur(6px);
  }
  .view-toggle button{
    font-family:'Noto Sans TC',sans-serif; font-size:11px; font-weight:700; padding:6px 10px;
    border-radius:16px; border:none; background:transparent; color:#6f89a8; cursor:pointer; white-space:nowrap;
  }
  .view-toggle button.active{ background:#20c9d6; color:#071b34; }

  body[data-view="desktop"] main{ max-width:1120px; }
  body[data-view="desktop"] #playScreen{ display:grid; grid-template-columns:1.15fr 0.85fr; gap:20px; align-items:start; }
  body[data-view="desktop"] .machine-shell{ grid-column:1; grid-row:1/3; margin-bottom:0; }
  body[data-view="desktop"] .sound-hint{ grid-column:2; grid-row:1; margin-top:0; }
  body[data-view="desktop"] .training-panel{ grid-column:2; grid-row:2; }
  body[data-view="desktop"] .scenario-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
</style>
</head>
<body>
<div class="view-toggle"><button id="viewMobileBtn">📱 手機版</button><button id="viewDesktopBtn">💻 電腦版</button></div>


<header>
  <button class="back-btn" id="backBtn">←</button>
  <div class="header-text">
    <div class="title" id="headerTitle">遊戲情境</div>
    <div class="sub" id="headerSub">選擇警報情境開始演練</div>
  </div>
</header>

<main>

  <div id="selectScreen">
    <div class="challenge-card">
      <div class="challenge-title">🏆 正式挑戰</div>
      <div class="challenge-desc">隨機抽取 3 關警報，每關限時 60 秒，依總分排行。結束後可提交成績到排行榜。</div>
      <button class="challenge-btn" id="startChallengeBtn">開始正式挑戰 →</button>
      <button class="leaderboard-link" id="toLeaderboardBtn">🏅 查看排行榜</button>
    </div>

    <div class="notice">
      <b>自由練習說明：</b>各情境畫面已依實際 Prismaflex 機台截圖還原文字、數值與按鍵配置，可任選單一警報無限時練習。已核對並開放：
      「輸入壓極度負值」「回輸壓極度正值」「過濾器已凝血」「液袋已空」「流動上的問題」「偵測到血液滲漏」。
    </div>
    <div class="scenario-grid" id="scenarioGrid"></div>
  </div>

  <div id="playScreen">

    <div class="machine-shell">
      <div class="machine-brand">prismaflex</div>
      <div class="machine-screen">
        <div class="m-topbar"><span id="mDate">04/December/17</span><span id="mTime">13:50</span></div>
        <div class="m-modebar"><span>執行</span><span>CVVHDF</span></div>

        <div class="m-banner pulsing" id="mBanner">警告：輸入壓極度負值</div>

        <div class="m-body" id="mBody">

/* ===================== 儀表繪製 ===================== */
function pct(v,min,max){ return Math.max(0,Math.min(100,(v-min)/(max-min)*100)); }
function placeLabel(container, text, p){
  const s = document.createElement('span');
  s.textContent = text;
  s.style.left = p + '%';
  s.style.transform = p < 8 ? 'translateX(0)' : (p > 92 ? 'translateX(-100%)' : 'translateX(-50%)');
  container.appendChild(s);
}
const BAND_COLORS = { red:'#e5484d', yellow:'#f2c744', green:'#3ecf6e' };
function renderGaugeInto(trackEl, rangeEl, cfg){
  const {min,max,value,redLeft,redRight,bands} = cfg;
  trackEl.innerHTML = ''; rangeEl.innerHTML = '';
  if(bands){
    let prev = min;
    bands.forEach(b => {
      const z = document.createElement('div'); z.className='g-zone';
      z.style.background = BAND_COLORS[b.color] || b.color;
      const pFrom = pct(prev,min,max), pTo = pct(b.end,min,max);
      z.style.left = pFrom + '%'; z.style.width = Math.max(0,(pTo-pFrom)) + '%';
      trackEl.appendChild(z);
      prev = b.end;
    });
    placeLabel(rangeEl, min, 0);
    placeLabel(rangeEl, max, 100);
  } else {
    const capL = document.createElement('div'); capL.className='g-endcap'; capL.style.left='0';
    trackEl.appendChild(capL);
    const capR = document.createElement('div'); capR.className='g-endcap'; capR.style.right='0';
    trackEl.appendChild(capR);
    if(redLeft !== undefined){
      const z = document.createElement('div'); z.className='g-zone';
      z.style.left='0'; z.style.width = pct(redLeft,min,max) + '%';
      trackEl.appendChild(z);
      placeLabel(rangeEl, redLeft, pct(redLeft,min,max));
    } else {
      placeLabel(rangeEl, min, 0);
    }
    if(redRight !== undefined){
      const z = document.createElement('div'); z.className='g-zone';
      const p = pct(redRight,min,max);
      z.style.left = p + '%'; z.style.width = (100-p) + '%';
      trackEl.appendChild(z);
      placeLabel(rangeEl, redRight, p);
    } else {
      placeLabel(rangeEl, max, 100);
    }
  }
  const marker = document.createElement('div'); marker.className='g-marker';
  marker.style.left = pct(value,min,max) + '%'; trackEl.appendChild(marker);
  const marker2 = document.createElement('div'); marker2.className='g-marker2';
  marker2.style.left = pct(value,min,max) + '%'; trackEl.appendChild(marker2);
}

function renderMachineScreen(def){
  document.getElementById('mDate').textContent = def.date;
  document.getElementById('mTime').textContent = def.time;
  document.getElementById('mBanner').textContent = def.title;

  document.getElementById('mBanner').className = 'm-banner pulsing' + (def.severity === 'notice' ? ' notice' : '');

  const ins = def.instructions;
  let leftHtml = '';
  if(ins.selfclear) leftHtml += `<div class="selfclear">${ins.selfclear}</div>`;
  if(ins.pre) leftHtml += `<div class="pre-line">${ins.pre}</div>`;
  if(ins.actions && ins.actions.length){
    leftHtml += `<div class="action-h">${ins.actionsHeading || '動作:'}</div><ol>${ins.actions.map(a=>`<li>${a}</li>`).join('')}</ol>`;
  }
  if(ins.note){
    leftHtml += `<div class="pre-line">${ins.note}</div>`;
  }
  if(ins.warningNote){
    leftHtml += `<div class="warning-note"><b>注意:</b> ${ins.warningNote}</div>`;
  }
  if(ins.otherCauses){
    leftHtml += `<div class="other-causes-h">其他可能原因:</div><div class="other-causes">${ins.otherCauses}</div>`;
  }
  if(ins.help){
    leftHtml += `<div class="helpline">${ins.help.replace('[幫助]','<span class="kw">[幫助]</span>')}</div>`;
  }
  document.getElementById('mLeft').innerHTML = leftHtml;

  const gaugePanel = document.getElementById('gaugePanel');
  const octagonPanel = document.getElementById('octagonPanel');
  const mBody = document.getElementById('mBody');
  if(def.rightPanelType === 'octagon'){
    gaugePanel.style.display = 'none';
    octagonPanel.style.display = 'flex';
    mBody.classList.add('octagon-mode');
  } else if(def.rightPanelType === 'none'){
    gaugePanel.style.display = 'none';
    octagonPanel.style.display = 'none';
    mBody.classList.add('octagon-mode');
  } else {
    gaugePanel.style.display = 'block';
    octagonPanel.style.display = 'none';
    mBody.classList.remove('octagon-mode');
    const gaugeRows = document.getElementById('gaugeRows');
    gaugeRows.innerHTML = '';
    def.gauges.forEach((g, idx) => {
      const row = document.createElement('div');
      row.className = 'gauge-row';
      row.innerHTML = `
        <div class="g-left"><div class="g-name">${g.name}</div><div class="g-value">${g.value}</div></div>
        <div class="g-bar-wrap"><div class="g-track"></div><div class="g-range"></div></div>`;
      gaugeRows.appendChild(row);
      renderGaugeInto(row.querySelector('.g-track'), row.querySelector('.g-range'), g);
    });
  }

  if(def.metrics){
    document.getElementById('mDrop').textContent = `壓力下降: ${def.metrics.drop}`;
    document.getElementById('mTmp').textContent = `TMP: ${def.metrics.tmp}`;
  }

  document.getElementById('btnRelease').style.display = def.hasRelease ? 'block' : 'none';
}

/* ===================== 遊戲狀態 ===================== */
let currentAlarmId = null, currentDef = null, currentCause = null;
let stepIndex = 0, mistakes = 0, score = 0;
let phase = 'mute'; // 'mute' | 'diagnose' | 'sequence'
let currentSequence = [];
let seqIndex = 0;
const BTN_PENALTY = { stop:-3, continue:-2, ignore:-2, release:-2, flow:-2 };
const BTN_LABEL = { stop:'停止', continue:'繼續', ignore:'忽略', release:'鬆開管路夾', flow:'流速設定' };

/* ---- 正式挑戰（限時排行賽）狀態 ---- */
let sessionMode = false, sessionQueue = [], sessionIndex = 0, sessionTotal = 0, sessionResults = [];
let roundWrongChoices = [];
let timerInterval = null, timeLeft = 60;
let roundFinished = false; // guards against a late correct-answer callback firing after the round already ended (timeout race)

const mBanner = document.getElementById('mBanner');
const btnMute = document.getElementById('btnMute');
const btnRelease = document.getElementById('btnRelease');
const btnResume = document.getElementById('btnResume');
const stepContent = document.getElementById('stepContent');
const successCard = document.getElementById('successCard');
const tpLabel = document.getElementById('tpLabel');
const headerTitle = document.getElementById('headerTitle');
const headerSub = document.getElementById('headerSub');
const alarmAudio = document.getElementById('alarmAudio');
const noticeAudio = document.getElementById('noticeAudio');
let activeAudio = alarmAudio;
let audioGapTimer = null;
let audioSilenced = false;
function selectAudioFor(def){
  if(def.noSound) return null;
  if(def.audioTrack === 'notice') return noticeAudio;
  if(def.severity === 'notice') return null; // no dedicated tone yet for this alarm
  return alarmAudio;
}
function scheduleAudioReplay(el){
  clearTimeout(audioGapTimer);
  audioGapTimer = setTimeout(() => {
    if(!audioSilenced && activeAudio === el){ el.currentTime = 0; el.play().catch(() => {}); }
  }, 3000);
}
alarmAudio.addEventListener('ended', () => scheduleAudioReplay(alarmAudio));
noticeAudio.addEventListener('ended', () => scheduleAudioReplay(noticeAudio));
function stopActiveAudio(silence){
  clearTimeout(audioGapTimer);
  if(silence) audioSilenced = true;
  alarmAudio.pause();
  noticeAudio.pause();
}

function shuffle(arr){ return [...arr].sort(() => Math.random() - 0.5); }
function updateScoreDisplay(delta){
  const el = document.getElementById('scoreBadge');
  el.textContent = '分數：' + score;
  el.classList.remove('up','down');
  if(delta > 0) el.classList.add('up');
  if(delta < 0) el.classList.add('down');
}

function startScenario(id){
  document.getElementById('selectScreen').style.display = 'none';
  document.getElementById('playScreen').style.display = 'block';
  headerTitle.textContent = '遊戲情境演練';
  headerSub.textContent = '請依實際步驟操作排除警報';

  currentAlarmId = id;
  currentDef = alarmDefs[id];
  currentCause = currentDef.causes[Math.floor(Math.random() * currentDef.causes.length)];
  mistakes = 0; score = 0; updateScoreDisplay(0);
  phase = 'mute';
  currentSequence = [];
  seqIndex = 0;
  roundWrongChoices = [];
  roundFinished = false;
  btnResume.textContent = currentDef.resumeLabel || '繼續';

  const timerBadge = document.getElementById('timerBadge');
  const roundBadge = document.getElementById('roundBadge');
  if(sessionMode){
    timerBadge.style.display = 'inline-block';
    roundBadge.style.display = 'block';
    roundBadge.textContent = `正式挑戰・第 ${sessionIndex+1} / ${sessionQueue.length} 關`;
    headerTitle.textContent = '正式挑戰';
    headerSub.textContent = `第 ${sessionIndex+1} / ${sessionQueue.length} 關・限時 60 秒`;
    startTimer();
  } else {
    timerBadge.style.display = 'none';
    roundBadge.style.display = 'none';
    clearInterval(timerInterval);
  }

  renderMachineScreen(currentDef);
  if(currentDef.rightPanelType === 'octagon'){
    const badgeColor = currentCause.color || currentDef.badgeColor;
    const badgeEl = document.getElementById('octagonBadge');
    if(badgeColor) badgeEl.style.background = badgeColor;
    badgeEl.classList.remove('shape-triangle','shape-square','shape-circle','shape-octagon');
    const badgeShape = currentCause.shape || currentDef.badgeShape || 'octagon';
    badgeEl.classList.add('shape-' + badgeShape);
  }
  mBanner.classList.add('pulsing'); mBanner.classList.remove('silenced');
  successCard.style.display = 'none';
  stopActiveAudio();
  audioSilenced = false;
  activeAudio = selectAudioFor(currentDef);
  if(activeAudio){
    activeAudio.currentTime = 0;
    activeAudio.play().catch(() => {});
  }
  renderStep();
}

function startTimer(){
  clearInterval(timerInterval);
  timeLeft = 60;
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if(timeLeft <= 0){
      clearInterval(timerInterval);
      roundTimeout();
    }
  }, 1000);
}
function updateTimerDisplay(){
  const el = document.getElementById('timerBadge');
  if(!el) return;
  el.textContent = '⏱ ' + timeLeft + 's';
  el.classList.toggle('urgent', timeLeft <= 10);
}
function roundTimeout(){
  showToast('⏱ 時間到！本關結束', 'bad');
  finishRound(false);
}

function startChallenge(){
  sessionMode = true;
  sessionQueue = shuffle(Object.keys(alarmDefs)).slice(0, 3);
  sessionIndex = 0; sessionTotal = 0; sessionResults = [];
  startScenario(sessionQueue[0]);
}

function finishRound(completed){
  if(roundFinished) return;
  roundFinished = true;
  clearInterval(timerInterval);
  sessionResults.push({
    title: currentDef.title,
    cue: currentCause.cue,
    resolveText: currentCause.resolveText,
    roundScore: score,
    completed: completed,
    mistakes: roundWrongChoices.slice()
  });
  sessionTotal += score;
  sessionIndex++;
  if(sessionIndex < sessionQueue.length){
    showToast(completed ? `第 ${sessionIndex} 關完成！準備下一關…` : '準備下一關…', completed ? 'good' : 'bad');
    setTimeout(() => startScenario(sessionQueue[sessionIndex]), 1400);
  } else {
    setTimeout(() => showSessionResults(), 1000);
  }
}

function showSessionResults(){
  clearInterval(timerInterval);
  stopActiveAudio();
  document.getElementById('playScreen').style.display = 'none';
  document.getElementById('resultsScreen').style.display = 'block';
  headerTitle.textContent = '挑戰結果';
  headerSub.textContent = '本次正式挑戰已結束';

  document.getElementById('resultsTotal').textContent = sessionTotal;
  const params = new URLSearchParams(location.search);
  const name = params.get('name') || '未具名學員';
  document.getElementById('resultsName').textContent = name;

  const wrap = document.getElementById('roundsBreakdown');
  wrap.innerHTML = '';
  sessionResults.forEach((r, i) => {
    const div = document.createElement('div');
    div.className = 'round-item';
    let mistakesHtml = '';
    if(r.mistakes.length){
      mistakesHtml = `<div class="r-mistakes-h">⚠ 誤選紀錄（共 ${r.mistakes.length} 次）</div>` +
        r.mistakes.map(m => `<div class="r-mistake">${m.label}（${m.penalty}分）</div>`).join('');
    }
    div.innerHTML = `
      <div class="rh"><span class="rt">第 ${i+1} 關．${r.title}</span><span class="rs">${r.roundScore} 分</span></div>
      <div class="r-status ${r.completed ? '' : 'timeout'}">${r.completed ? '✅ 已完成' : '⏱ 時間到，未完成'}</div>
      <div class="r-answer"><b>情境：</b>${r.cue}<br><b>正確處置：</b>${r.resolveText}</div>
      ${mistakesHtml}`;
    wrap.appendChild(div);
  });

  const submitBtn = document.getElementById('submitScoreBtn');
  submitBtn.disabled = false;
  submitBtn.textContent = '📤 提交成績到排行榜';
  document.getElementById('submitStatus').textContent = '';
}

async function submitScore(){
  const submitBtn = document.getElementById('submitScoreBtn');
  const statusEl = document.getElementById('submitStatus');
  submitBtn.disabled = true;
  submitBtn.textContent = '提交中…';
  const params = new URLSearchParams(location.search);
  const name = params.get('name') || '未具名學員';
  const entry = {
    name, totalScore: sessionTotal, timestamp: Date.now(),
    rounds: sessionResults.map(r => ({ title:r.title, roundScore:r.roundScore, completed:r.completed, mistakes:r.mistakes }))
  };
  try {
    await db.collection('leaderboard').add(entry);
    submitBtn.textContent = '✅ 已提交成績';
    statusEl.textContent = '成績已送出，可至排行榜查看';
  } catch(e){
    submitBtn.disabled = false;
    submitBtn.textContent = '📤 提交成績到排行榜';
    statusEl.textContent = '⚠ 提交失敗，請檢查網路後重試（' + (e && e.message ? e.message : '未知錯誤') + '）';
  }
}

function defaultSequence(){
  return [{ type:'button', which: (currentDef.resumeLabel === '忽略') ? 'ignore' : 'continue' }];
}

function renderStep(){
  stepContent.style.display = 'block';
  successCard.style.display = 'none';

  if(phase === 'mute'){
    tpLabel.textContent = 'STEP 1';
    stepContent.innerHTML = '';
  } else if(phase === 'diagnose'){
    tpLabel.textContent = 'STEP 2．找出並排除原因';
    const opts = shuffle(currentDef.actionOptions);
    const cueHtml = currentCause.cue
      ? `<div class="cue-card"><b>情境提示：</b>${currentCause.cue}<br><br>請根據情境選擇正確的排除措施：</div>`
      : '';
    stepContent.innerHTML = cueHtml + '<div id="optWrap"></div>';
    const wrap = document.getElementById('optWrap');
    opts.forEach(o => {
      const b = document.createElement('button');
      b.className = 'btn-device';
      b.textContent = o.label;
      b.addEventListener('click', () => handleAction(o, b));
      wrap.appendChild(b);
    });
  } else if(phase === 'sequence'){
    stepContent.innerHTML = '';
  }
}

function advanceSequence(){
  if(seqIndex >= currentSequence.length){
    completeScenario();
    return;
  }
  const item = currentSequence[seqIndex];
  if(item.type === 'confirm'){
    stepContent.innerHTML = '<div id="confirmWrap"></div>';
    const wrap = document.getElementById('confirmWrap');
    const b = document.createElement('button');
    b.className = 'btn-device';
    b.textContent = item.label;
    b.addEventListener('click', () => {
      b.classList.add('correct-flash');
      b.disabled = true;
      seqIndex++;
      setTimeout(() => advanceSequence(), 400);
    });
    wrap.appendChild(b);
  }
}

function pressRealButton(which){
  if(phase !== 'sequence' || seqIndex >= currentSequence.length ||
     currentSequence[seqIndex].type !== 'button' || currentSequence[seqIndex].which !== which){
    applyButtonPenalty(which);
    return;
  }
  seqIndex++;
  advanceSequence();
}

function applyButtonPenalty(which){
  const p = BTN_PENALTY[which];
  score += p; updateScoreDisplay(p);
  mistakes++;
  if(sessionMode) roundWrongChoices.push({ label: `未依序按下【${BTN_LABEL[which]}】`, penalty: p });
  if(p <= -3){
    showToast(`🚫 嚴禁按下【${BTN_LABEL[which]}】排除警報 (${p}分)`, 'bad');
  } else {
    showToast(`⚠ 尚未完成正確流程就按下【${BTN_LABEL[which]}】 (${p}分)`, 'bad');
  }
}

function completeScenario(){
  if(sessionMode){
    clearInterval(timerInterval);
    finishRound(true);
    return;
  }
  stepContent.style.display = 'none';
  successCard.style.display = 'block';
  document.getElementById('successText').textContent =
    `本次情境原因：${currentCause.resolveText}（共 ${mistakes} 次誤選，本次得分：${score} 分）`;
}

function refreshGaugeValue(index, newValue){
  const rows = document.querySelectorAll('#gaugeRows .gauge-row');
  const row = rows[index];
  if(!row) return;
  row.querySelector('.g-value').textContent = newValue;
  const g = { ...currentDef.gauges[index], value:newValue };
  renderGaugeInto(row.querySelector('.g-track'), row.querySelector('.g-range'), g);
}

function handleAction(option, btnEl){
  if(option.id === currentCause.correct){
    btnEl.classList.add('correct-flash');
    if(currentDef.gauges && currentDef.gauges.length){
      const fg = currentDef.fixGauge || { index:0, value: currentDef.gauges[0].value };
      refreshGaugeValue(fg.index, fg.value);
    }
    score += 1; updateScoreDisplay(1);
    showToast('✅ 措施正確 +1', 'good');
    setTimeout(() => {
      if(roundFinished) return;
      currentSequence = currentCause.finalSequence || defaultSequence();
      seqIndex = 0;
      phase = 'sequence';
      renderStep();
    }, 700);
  } else {
    mistakes++;
    btnEl.classList.add('wrong-flash');
    btnEl.disabled = true;
    const penalty = option.penalty !== undefined ? option.penalty : -1;
    score += penalty; updateScoreDisplay(penalty);
    if(sessionMode) roundWrongChoices.push({ label: option.label, penalty });
    if(penalty <= -3){
      showToast(`🚫 危險操作，可能造成栓塞或治療併發症 (${penalty}分)`, 'bad');
    } else {
      showToast(`此措施未改善狀況，請重新評估其他可能原因 (${penalty}分)`, 'bad');
    }
  }
}

/* ===================== 機台按鍵互動 ===================== */
btnMute.addEventListener('click', () => {
  if(phase !== 'mute') return;
  mBanner.classList.remove('pulsing');
  mBanner.classList.add('silenced');
  stopActiveAudio(true);
  score += 1; updateScoreDisplay(1);
  phase = 'diagnose';
  renderStep();
  showToast('✅ 正確按下靜音 +1，請找出並排除原因', 'good');
});

btnRelease.addEventListener('click', () => pressRealButton('release'));
btnResume.addEventListener('click', () => pressRealButton(currentDef.resumeLabel === '忽略' ? 'ignore' : 'continue'));
document.getElementById('btnStop').addEventListener('click', () => pressRealButton('stop'));
document.getElementById('btnFlow').addEventListener('click', () => {
  const expected = currentSequence[seqIndex];
  if(phase === 'sequence' && expected && expected.type === 'button' && expected.which === 'flow'){
    pressRealButton('flow');
  } else {
    showToast('此按鍵僅供畫面對照，本情境訓練重點不需使用');
  }
});
['btnHelp','btnCheckAlarm'].forEach(id => {
  document.getElementById(id).addEventListener('click', () => showToast('此按鍵僅供畫面對照，本情境訓練重點不需使用'));
});

document.getElementById('againBtn').addEventListener('click', () => startScenario(currentAlarmId));
document.getElementById('toSelectBtn').addEventListener('click', () => {
  stopActiveAudio();
  clearInterval(timerInterval);
  sessionMode = false;
  document.getElementById('playScreen').style.display = 'none';
  document.getElementById('resultsScreen').style.display = 'none';
  document.getElementById('selectScreen').style.display = 'block';
  headerTitle.textContent = '遊戲情境';
  headerSub.textContent = '選擇警報情境開始演練';
});

/* ===================== Toast / Nav ===================== */
const toast = document.getElementById('toast');
function showToast(msg, kind){
  toast.textContent = msg;
  toast.className = 'toast show' + (kind ? ' ' + kind : '');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { toast.classList.remove('show'); }, 2600);
}
/* ===================== 正式挑戰 / 排行榜按鈕 ===================== */
document.getElementById('startChallengeBtn').addEventListener('click', startChallenge);
document.getElementById('toLeaderboardBtn').addEventListener('click', () => {
  const params = new URLSearchParams(location.search);
  const name = params.get('name');
  location.href = 'crrt_leaderboard.html' + (name ? ('?name=' + encodeURIComponent(name)) : '');
});
document.getElementById('submitScoreBtn').addEventListener('click', submitScore);
document.getElementById('viewLeaderboardBtn').addEventListener('click', () => {
  const params = new URLSearchParams(location.search);
  const name = params.get('name');
  location.href = 'crrt_leaderboard.html' + (name ? ('?name=' + encodeURIComponent(name)) : '');
});
document.getElementById('retryChallengeBtn').addEventListener('click', () => {
  document.getElementById('resultsScreen').style.display = 'none';
  document.getElementById('playScreen').style.display = 'block';
  startChallenge();
});
document.getElementById('resultsHomeBtn').addEventListener('click', () => {
  location.href = 'index.html';
});

document.getElementById('backBtn').addEventListener('click', () => {
  if(document.getElementById('playScreen').style.display === 'block'){
    document.getElementById('toSelectBtn').click();
  } else {
    const p = new URLSearchParams();
    const nm = getParam('name'); if(nm) p.set('name', nm);
    p.set('view', currentViewMode());
    location.href = 'index.html?' + p.toString();
  }
});

/* 讀取由首頁傳入的姓名，顯示於選單副標題 */
(function(){
  const params = new URLSearchParams(location.search);
  const name = params.get('name');
  if(name){
    headerSub.textContent = `歡迎，${name}！選擇警報情境開始演練`;
  }
})();
</script>


<script>
function getParam(name){ return new URLSearchParams(location.search).get(name); }
function applyViewMode(mode){
  document.body.setAttribute('data-view', mode);
  document.getElementById('viewMobileBtn').classList.toggle('active', mode==='mobile');
  document.getElementById('viewDesktopBtn').classList.toggle('active', mode==='desktop');
}
function currentViewMode(){ return document.body.getAttribute('data-view') || 'mobile'; }
function setViewParam(mode){
  try {
    const p = new URLSearchParams(location.search);
    p.set('view', mode);
    history.replaceState(null, '', location.pathname + '?' + p.toString());
  } catch(e) {
    /* replaceState is blocked in sandboxed/srcdoc preview contexts (e.g. Claude's in-chat preview) — safe to ignore, only cosmetic */
  }
}
(function initView(){
  let mode = getParam('view');
  if(!mode) mode = (window.innerWidth >= 900 ? 'desktop' : 'mobile');
  applyViewMode(mode);
})();
document.getElementById('viewMobileBtn').addEventListener('click', () => { applyViewMode('mobile'); setViewParam('mobile'); });
document.getElementById('viewDesktopBtn').addEventListener('click', () => { applyViewMode('desktop'); setViewParam('desktop'); });
</script>
